name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests (system python3)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build menu bar app
        run: make app
      - name: Smoke-test CLI
        run: |
          bin/buildq --version
          BUILDQ_HOME=$RUNNER_TEMP/bq bin/buildq run --label smoke -- echo ok
          BUILDQ_HOME=$RUNNER_TEMP/bq bin/buildq status

  homebrew:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install and test the formula from a local tap
        run: |
          brew tap-new --no-git local/buildq
          cp Formula/buildq.rb "$(brew --repository local/buildq)/Formula/"
          brew install --build-from-source local/buildq/buildq
          brew test local/buildq/buildq
          test -x "$(brew --prefix)/opt/buildq/BuildQBar.app/Contents/MacOS/BuildQBar"
